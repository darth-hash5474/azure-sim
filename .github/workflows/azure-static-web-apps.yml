# Builds the menu (which bundles all five games) and deploys Menu/dist to Azure Static Web Apps.
# Needs the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (from `az staticwebapp secrets list`).

name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      # Each app is its own Vite project, so each needs its own install.
      - name: Install dependencies
        run: |
          for dir in Menu Manage-Resources Cold-Storage Slot-Swap No-Route Night-Shift; do
            echo "::group::npm ci ($dir)"
            npm ci --prefix "$dir" --no-audit --no-fund
            echo "::endgroup::"
          done

      # The menu build runs every game's build and copies them into Menu/dist/games/<id>/.
      - name: Build
        run: npm run build --prefix Menu

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: Menu/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
