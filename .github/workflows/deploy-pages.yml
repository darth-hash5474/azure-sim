# Builds the menu (which bundles all five games) and deploys Menu/dist to GitHub Pages.
# Requires Settings → Pages → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      # Each app is its own Vite project, so each needs its own install.
      - name: Install dependencies
        run: |
          for dir in Menu Manage-Resources Cold-Storage Slot-Swap No-Route Night-Shift; do
            echo "::group::npm ci ($dir)"
            npm ci --prefix "$dir" --no-audit --no-fund
            echo "::endgroup::"
          done

      # The menu build runs every game's build and copies them into Menu/dist/games/<id>/.
      - name: Build
        run: npm run build --prefix Menu

      - uses: actions/upload-pages-artifact@v4
        with:
          path: Menu/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
