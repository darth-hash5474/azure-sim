# Builds the menu (which bundles all five games) and deploys Menu/dist to GitHub Pages.
# Requires Settings → Pages → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm workspaces: one install at the root covers every app and the shared packages.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The menu build runs every game's build and copies them into Menu/dist/games/<id>/.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: Menu/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
